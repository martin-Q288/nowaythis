name: Hourly Viral Radar
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_radar.py'
      - '.github/workflows/radar-hourly.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh radar feed
        run: python scripts/update_radar.py
      - name: Commit if changed
        run: |
          git config user.name "NO WAY Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar-feed.json
          git diff --cached --quiet || git commit -m "Refresh hourly viral radar"
          git push
