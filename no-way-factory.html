<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NO WAY FACTORY</title>
<meta name="theme-color" content="#090b0d" />
<style>
:root{--bg:#090b0d;--panel:#111419;--panel2:#171b21;--line:#272d35;--text:#f5f7fa;--muted:#8d98a6;--green:#55ff8a;--yellow:#ffd84d;--red:#ff6464;--blue:#70a5ff;--radius:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(9,11,13,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 18px}.topin{max-width:1560px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #31543e;background:#0b1710;border-radius:12px;display:grid;place-items:center;color:var(--green);font-weight:900}.brand h1{margin:0;font-size:18px;letter-spacing:.5px}.brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}.counter{min-width:240px}.counterline{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}.counterline strong{color:var(--green)}.bar{height:8px;background:#1c2229;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39e978,#b7ff62);border-radius:inherit;transition:.3s}.layout{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:330px minmax(520px,1fr) 390px;gap:14px;padding:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.ph{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.ph h2{font-size:13px;margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:12px}.btn:hover{border-color:#46515f}.btn.green{background:var(--green);border-color:var(--green);color:#061109}.btn.red{color:#ff9b9b}.btn.yellow{color:#ffe480}.tabs{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);overflow:auto}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:800}.tab.on{background:#1d2a22;color:var(--green)}.items{padding:8px;max-height:calc(100vh - 188px);overflow:auto}.item{padding:13px 12px;border:1px solid transparent;border-radius:12px;cursor:pointer;margin-bottom:5px}.item:hover{background:#15191f}.item.on{background:#151c18;border-color:#2d6540}.itemtop{display:flex;gap:9px;align-items:center}.score{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#17241c;color:var(--green);font-weight:900}.ititle{font-size:13px;font-weight:800;line-height:1.35}.imeta{font-size:11px;color:var(--muted);margin-top:4px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);color:var(--muted);padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}.pill.READY{border-color:#2d6540;color:var(--green)}.pill.HOLD{border-color:#665823;color:var(--yellow)}.pill.REJECT{border-color:#633535;color:#ff8b8b}.pill.POSTED{border-color:#34577d;color:#8ec2ff}.work{padding:14px}.titleRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.titleRow h3{margin:0;font-size:17px}.scoregrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:9px}.sg{background:#15191f;border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center;font-size:10px;color:var(--muted)}.sg b{display:block;color:#fff;font-size:14px}.previews{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}.preview{background:#0b0d10;border:1px solid var(--line);border-radius:13px;padding:8px}.preview h4{font-size:11px;margin:0 0 7px;color:var(--muted)}.canvasWrap{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#20262d,#101317);display:grid;place-items:center}.canvasWrap canvas{width:100%;height:100%;display:block}.placeholder{position:absolute;text-align:center;color:#687481;font-size:11px;padding:20px}.file{display:none}.hookbox{margin-top:14px}.sectionTitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px}.hooks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hook{background:#15191f;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:12px;line-height:1.4}.hook.on{border-color:var(--green);background:#142019}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0f1216;color:#fff;border-radius:9px;padding:9px;outline:0}.field textarea{min-height:92px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus{border-color:#3c6850}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.rightbody{padding:13px;max-height:calc(100vh - 100px);overflow:auto}.box{border:1px solid var(--line);background:#0f1216;border-radius:12px;padding:11px;margin-bottom:10px}.boxtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.boxtop b{font-size:12px}.caption{white-space:pre-wrap;color:#dbe1e8;font-size:12px;line-height:1.65;max-height:180px;overflow:auto}.music{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #20252c;font-size:12px}.music:last-child{border:0}.music small{color:var(--muted)}.source{font-size:11px;line-height:1.55;color:#b7c0cc;word-break:break-all}.checks label{display:flex;gap:8px;align-items:center;font-size:11px;padding:5px 0}.checks input{accent-color:var(--green)}.guide{counter-reset:n}.guide div{display:flex;gap:8px;font-size:11px;color:#bac2cc;margin:7px 0}.guide div:before{counter-increment:n;content:counter(n);width:19px;height:19px;border-radius:6px;background:#18221c;color:var(--green);display:grid;place-items:center;font-weight:900;flex:none}.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.modalcard{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.modalcard h3{margin:0 0 14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#eafef0;color:#092011;padding:10px 15px;border-radius:10px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}.analytics{display:none;padding:14px}.analytics.on{display:block}.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:14px;background:#101419;border:1px solid var(--line);border-radius:12px}.metric small{color:var(--muted)}.metric b{display:block;font-size:22px;margin-top:3px}.oldfactory{color:var(--green);text-decoration:none;font-size:11px}@media(max-width:1150px){.layout{grid-template-columns:280px 1fr}.right{grid-column:1/-1}.rightbody{max-height:none}.previews{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.topin{align-items:flex-start;flex-direction:column}.counter{width:100%}.layout{display:block;padding:8px}.panel{margin-bottom:8px}.items{max-height:290px}.previews{grid-template-columns:1fr 1fr}.previews .preview:first-child{grid-column:1/-1}.hooks,.scoregrid{grid-template-columns:repeat(3,1fr)}.editgrid,.two{grid-template-columns:1fr}.cards4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin">
  <div class="brand"><div class="logo">NW</div><div><h1>NO WAY FACTORY</h1><p>RADAR → VERIFY → KR/JP CARD → CAPTION → MUSIC → QUEUE</p></div></div>
  <div class="counter"><div class="counterline"><span>최근 14일 게시량</span><span><strong id="count14">0</strong> / <span id="limitText">150</span> <button class="btn" style="padding:3px 7px" onclick="editLimit()">설정</button></span></div><div class="bar"><i id="countBar"></i></div></div>
</div></header>
<div class="layout">
  <aside class="panel left">
    <div class="ph"><h2>CONTENT RADAR</h2><button class="btn green" onclick="openModal()">+ 소재 추가</button></div>
    <div class="tabs"><button class="tab on" data-filter="ALL">ALL</button><button class="tab" data-filter="READY">READY</button><button class="tab" data-filter="HOLD">HOLD</button><button class="tab" data-filter="POSTED">POSTED</button><button class="tab" data-filter="REJECT">REJECT</button></div>
    <div id="items" class="items"></div>
  </aside>

  <main class="panel center">
    <div class="ph"><h2>CONTENT STUDIO</h2><span><a class="oldfactory" href="insta-card-factory.html" target="_blank">기존 카드 제작기 열기 ↗</a></span></div>
    <div id="work" class="work"></div>
    <div id="analytics" class="analytics"><div class="cards4"><div class="metric"><small>POSTED</small><b id="mPosted">0</b></div><div class="metric"><small>READY</small><b id="mReady">0</b></div><div class="metric"><small>AVG SCORE</small><b id="mScore">0</b></div><div class="metric"><small>14D RATE</small><b id="mRate">0%</b></div></div></div>
  </main>

  <aside class="panel right">
    <div class="ph"><h2>PUBLISH PACK</h2><button class="btn" onclick="showAnalytics()">Analytics</button></div>
    <div id="rightbody" class="rightbody"></div>
  </aside>
</div>
</div>

<div id="modal" class="modal"><div class="modalcard"><div style="display:flex;justify-content:space-between;align-items:center"><h3>새 소재 추가</h3><button class="btn" onclick="closeModal()">닫기</button></div>
<div class="field"><label>소재 제목</label><input id="nTitle" placeholder="예: 23살 조종사가 바다에 비상착륙" /></div>
<div class="two"><div class="field"><label>바이럴 점수 (0~30)</label><input id="nScore" type="number" min="0" max="30" value="28" /></div><div class="field"><label>카테고리</label><select id="nCat"><option>해외토픽</option><option>해외연예</option><option>국내연예</option><option>동물</option><option>생존/구조</option></select></div></div>
<div class="field"><label>원본/기사 URL</label><input id="nSource" placeholder="https://..." /></div>
<div class="two"><div class="field"><label>KR 훅</label><input id="nHookKr" placeholder="바다에 내렸다" /></div><div class="field"><label>JP 훅</label><input id="nHookJp" placeholder="海に着陸した" /></div></div>
<div class="field"><label>한국어 캡션</label><textarea id="nCapKr" placeholder="게시글 본문"></textarea></div>
<div class="field"><label>일본어 캡션</label><textarea id="nCapJp" placeholder="日本語キャプション"></textarea></div>
<div class="actions"><button class="btn green" onclick="addItem()">소재 저장</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
const seed=[
{id:'s1',title:'23살 조종사가 비행기를 바다에 내린 순간',score:29,cat:'생존/구조',status:'READY',created:Date.now()-3600000,hooksKr:['바다에 내렸다','23살 조종사의 선택','엔진이 멈췄다'],hooksJp:['海に着陸した','23歳の決断','エンジンが止まった'],hookIdx:0,captionKr:'23살 조종사가 비행 도중 엔진과 랜딩기어 고장을 동시에 맞았습니다.\n\n결국 그녀가 선택한 활주로는 바다였습니다.\n\n사람이 붐비는 해변을 피해 바다에 비상착수했고, 큰 부상 없이 구조됐습니다.\n\n여러분이라면 저 순간 같은 결정을 할 수 있었을까요?\n\n#NOWAYTHIS #해외토픽 #생존실화 #비상착륙',captionJp:'23歳のパイロットが飛行中、エンジンと着陸装置のトラブルに直面しました。\n\n彼女が選んだ滑走路は海。\n\n人の多いビーチを避けて緊急着水し、無事に救助されました。\n\n#海外ニュース #実話 #NOWAYTHIS',source:'실제 원본/공식 사진 URL을 입력하세요',fact:['원본 출처 확인','사건 날짜 확인','수치/인용 교차검증'],music:['Experience — Ludovico Einaudi','Runaway — AURORA','The Nights — Avicii'],scores:[5,5,5,5,5,4]},
{id:'s2',title:'지드래곤이 카메라 감독 뒤를 막아선 장면',score:29,cat:'국내연예',status:'HOLD',created:Date.now()-7200000,hooksKr:['뒤를 먼저 봤다','지드래곤이 막아섰다','한 걸음 전이었다'],hooksJp:['先に後ろを見た','G-DRAGONが止めた','あと一歩だった'],hookIdx:0,captionKr:'공연 도중 카메라 감독이 무대 끝으로 뒷걸음질했습니다.\n\n지드래곤은 이를 먼저 발견하고 감독 뒤로 이동해 안전을 확인했습니다.\n\n실제로 추락한 것은 아니며, 위험을 미리 막은 장면입니다.\n\n#NOWAYTHIS #지드래곤 #BIGBANG',captionJp:'公演中、カメラマンがステージの端へ後ずさり。\n\nG-DRAGONはそれに気づき、背後に回って安全を確保しました。\n\n#GDRAGON #BIGBANG #NOWAYTHIS',source:'실제 팬 영상/보도 URL 입력 필요',fact:['실제 영상 확인','추락/부상 과장 금지','당사자 발언 출처 확인'],music:['HOME SWEET HOME — G-DRAGON','Untitled, 2014 — G-DRAGON','DRAMA — G-DRAGON'],scores:[5,4,5,5,5,5]},
{id:'s3',title:'텍사스 쇼핑센터에서 발견된 정체불명 동물',score:28,cat:'동물',status:'READY',created:Date.now()-10800000,hooksKr:['경찰도 몰랐다','이 동물의 정체는?','캥거루? 원숭이?'],hooksJp:['警察も分からなかった','この動物の正体は？','カンガルー？サル？'],hookIdx:1,captionKr:'미국 텍사스 쇼핑센터에서 정체불명의 동물이 발견됐습니다.\n\n정체는 중남미 열대우림에 사는 킨카주. 원숭이처럼 보이지만 라쿤과 가까운 동물입니다.\n\n#NOWAYTHIS #해외토픽 #희귀동물',captionJp:'アメリカ・テキサスのショッピングセンターで謎の動物が発見されました。\n\n正体はキンカジュー。サルのように見えますが、アライグマに近い動物です。\n\n#海外ニュース #珍しい動物 #NOWAYTHIS',source:'경찰 공식 공개 사진 URL 입력 필요',fact:['경찰 발표 확인','종 분류 확인','주인 여부 단정 금지'],music:['Mystery of Love — Sufjan Stevens','Curious — Franz Ferdinand','original audio'],scores:[4,5,5,4,5,5]}
];
let data=JSON.parse(localStorage.getItem('nwf-data')||'null')||seed;let selected=localStorage.getItem('nwf-selected')||data[0]?.id;let filter='ALL';let imgMap={};let limit=+(localStorage.getItem('nwf-limit')||150);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('nwf-data',JSON.stringify(data));localStorage.setItem('nwf-selected',selected);render();}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusPill(s){return `<span class="pill ${s}">${s}</span>`}
function getSel(){return data.find(x=>x.id===selected)||data[0]}
function render(){renderCounter();renderItems();renderWork();renderRight();renderAnalytics()}
function renderCounter(){let cutoff=Date.now()-14*864e5;let c=data.filter(x=>x.status==='POSTED'&&x.postedAt>=cutoff).length;$('#count14').textContent=c;$('#limitText').textContent=limit;$('#countBar').style.width=Math.min(100,c/limit*100)+'%'}
function renderItems(){let arr=data.filter(x=>filter==='ALL'||x.status===filter);$('#items').innerHTML=arr.length?arr.map(x=>`<div class="item ${x.id===selected?'on':''}" onclick="selectItem('${x.id}')"><div class="itemtop"><div class="score">${x.score}</div><div style="flex:1"><div class="ititle">${esc(x.title)}</div><div class="imeta">${esc(x.cat)} · ${ago(x.created)} · ${statusPill(x.status)}</div></div></div></div>`).join(''):'<div class="empty">해당 상태의 콘텐츠가 없습니다.</div>'}
function ago(t){let h=Math.max(1,Math.round((Date.now()-t)/36e5));return h<24?h+'시간 전':Math.round(h/24)+'일 전'}
function selectItem(id){selected=id;save()}
function renderWork(){let x=getSel();if(!x){$('#work').innerHTML='<div class="empty">소재를 추가하세요.</div>';return}$('#work').innerHTML=`<div class="titleRow"><div><h3>${esc(x.title)}</h3><div class="imeta">${esc(x.cat)} · ${statusPill(x.status)}</div><div class="scoregrid">${['화제성','호기심','공유성','감정','시각성','적합성'].map((n,i)=>`<div class="sg">${n}<b>${x.scores?.[i]||'-'}</b></div>`).join('')}</div></div><button class="btn" onclick="deleteItem('${x.id}')">삭제</button></div>
<div class="previews"><div class="preview"><h4>ORIGINAL</h4><div class="canvasWrap" onclick="document.getElementById('file-${x.id}').click()"><canvas id="orig"></canvas><div class="placeholder" id="origph">클릭해서 실제 원본 사진 업로드<br><span style="color:#55ff8a">AI 사건 재현 이미지 사용 금지</span></div></div><input id="file-${x.id}" class="file" type="file" accept="image/*" onchange="loadImage(event,'${x.id}')"></div><div class="preview"><h4>KOREA · 1080×1350</h4><div class="canvasWrap"><canvas id="kr"></canvas></div></div><div class="preview"><h4>JAPAN · 1080×1350</h4><div class="canvasWrap"><canvas id="jp"></canvas></div></div></div>
<div class="hookbox"><p class="sectionTitle">HOOK OPTIONS</p><div class="hooks">${x.hooksKr.map((h,i)=>`<div class="hook ${i===x.hookIdx?'on':''}" onclick="setHook(${i})"><b>${i+1}</b> ${esc(h)}<div class="muted" style="font-size:10px;margin-top:4px">${esc(x.hooksJp[i]||'')}</div></div>`).join('')}</div><div class="editgrid"><div class="field"><label>KR 최종 훅</label><input value="${esc(x.hooksKr[x.hookIdx]||'')}" oninput="editHook('kr',this.value)"></div><div class="field"><label>JP 최종 훅</label><input value="${esc(x.hooksJp[x.hookIdx]||'')}" oninput="editHook('jp',this.value)"></div></div></div>
<div class="actions"><button class="btn green" onclick="downloadCard('kr')">KR 이미지 다운로드</button><button class="btn green" onclick="downloadCard('jp')">JP 이미지 다운로드</button><button class="btn" onclick="document.getElementById('file-${x.id}').click()">실제 사진 교체</button><button class="btn yellow" onclick="setStatus('READY')">READY</button><button class="btn" onclick="setStatus('HOLD')">HOLD</button><button class="btn red" onclick="setStatus('REJECT')">REJECT</button><button class="btn" style="color:#8ec2ff" onclick="markPosted()">POSTED</button></div>`;requestAnimationFrame(drawAll)}
function renderRight(){let x=getSel();if(!x){$('#rightbody').innerHTML='';return}$('#rightbody').innerHTML=`<div class="box"><div class="boxtop"><b>🇰🇷 KR CAPTION</b><button class="btn" onclick="copyText('kr')">복사</button></div><textarea id="capkr" style="width:100%;min-height:150px;background:transparent;border:0;color:#dbe1e8;resize:vertical;line-height:1.6" oninput="editCaption('kr',this.value)">${esc(x.captionKr)}</textarea></div><div class="box"><div class="boxtop"><b>🇯🇵 JP CAPTION</b><button class="btn" onclick="copyText('jp')">コピー</button></div><textarea id="capjp" style="width:100%;min-height:130px;background:transparent;border:0;color:#dbe1e8;resize:vertical;line-height:1.6" oninput="editCaption('jp',this.value)">${esc(x.captionJp)}</textarea></div><div class="box"><div class="boxtop"><b>🎵 INSTAGRAM MUSIC</b><span class="pill">수동 선택</span></div>${x.music.map((m,i)=>`<div class="music"><span>${i+1}. ${esc(m)}</span><button class="btn" onclick="navigator.clipboard.writeText('${esc(m).replace(/'/g,"\\'")}');toast('음원명 복사')">복사</button></div>`).join('')}</div><div class="box"><div class="boxtop"><b>🔗 SOURCE</b><button class="btn" onclick="editSource()">편집</button></div><div class="source">${esc(x.source)}</div></div><div class="box"><div class="boxtop"><b>✅ FACT CHECK</b><span class="pill">확인 필요</span></div><div class="checks">${x.fact.map((f,i)=>`<label><input type="checkbox" ${x.factDone?.[i]?'checked':''} onchange="toggleFact(${i},this.checked)"> ${esc(f)}</label>`).join('')}</div></div><div class="box"><div class="boxtop"><b>📱 INSTAGRAM에서 게시하기</b><span class="pill">마지막 단계</span></div><div class="guide"><div>KR/JP 이미지 다운로드</div><div>해당 계정 Instagram 앱 열기</div><div>사진 게시물 선택 후 음악 추가</div><div>추천 음원 검색·선택</div><div>캡션 붙여넣기 후 게시</div><div>사이트에서 POSTED 처리</div></div></div>`}
function renderAnalytics(){let posted=data.filter(x=>x.status==='POSTED').length,ready=data.filter(x=>x.status==='READY').length,avg=data.length?Math.round(data.reduce((a,b)=>a+b.score,0)/data.length*10)/10:0;$('#mPosted').textContent=posted;$('#mReady').textContent=ready;$('#mScore').textContent=avg;let cutoff=Date.now()-14*864e5,c=data.filter(x=>x.status==='POSTED'&&x.postedAt>=cutoff).length;$('#mRate').textContent=Math.round(c/limit*100)+'%'}
function setHook(i){let x=getSel();x.hookIdx=i;save()}
function editHook(lang,v){let x=getSel();if(lang==='kr')x.hooksKr[x.hookIdx]=v;else x.hooksJp[x.hookIdx]=v;localStorage.setItem('nwf-data',JSON.stringify(data));drawAll()}
function editCaption(lang,v){let x=getSel();if(lang==='kr')x.captionKr=v;else x.captionJp=v;localStorage.setItem('nwf-data',JSON.stringify(data))}
function editSource(){let x=getSel(),v=prompt('원본/공식 출처 URL 또는 설명',x.source);if(v!==null){x.source=v;save()}}
function toggleFact(i,v){let x=getSel();x.factDone=x.factDone||[];x.factDone[i]=v;localStorage.setItem('nwf-data',JSON.stringify(data))}
function setStatus(s){getSel().status=s;save();toast(s+'로 이동')}
function markPosted(){let x=getSel();x.status='POSTED';x.postedAt=Date.now();save();toast('POSTED 처리 완료')}
function deleteItem(id){if(confirm('이 소재를 삭제할까요?')){data=data.filter(x=>x.id!==id);selected=data[0]?.id||'';save()}}
function loadImage(e,id){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{imgMap[id]=im;drawAll();toast('실제 사진 적용 완료')};im.src=r.result};r.readAsDataURL(f)}
function cover(ctx,im,w,h){let s=Math.max(w/im.width,h/im.height),nw=im.width*s,nh=im.height*s;ctx.drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh)}
function drawCanvas(id,lang){let c=document.getElementById(id);if(!c)return;c.width=1080;c.height=1350;let ctx=c.getContext('2d'),x=getSel(),im=imgMap[x.id];ctx.fillStyle='#11161b';ctx.fillRect(0,0,c.width,c.height);if(im)cover(ctx,im,c.width,c.height);else{let g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#273038');g.addColorStop(1,'#0e1115');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#65717c';ctx.font='700 34px sans-serif';ctx.textAlign='center';ctx.fillText(lang==='kr'?'실제 사진을 업로드하세요':'実際の写真をアップロード',540,650)}let grad=ctx.createLinearGradient(0,700,0,1350);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(.45,'rgba(0,0,0,.45)');grad.addColorStop(1,'rgba(0,0,0,.92)');ctx.fillStyle=grad;ctx.fillRect(0,650,1080,700);let text=lang==='kr'?x.hooksKr[x.hookIdx]:x.hooksJp[x.hookIdx];ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='900 76px sans-serif';ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=12;wrap(ctx,text,72,1020,930,84,3);ctx.shadowBlur=0;ctx.fillStyle='#55ff8a';ctx.fillRect(72,1240,46,5);ctx.fillStyle='#eef4f0';ctx.font='800 25px sans-serif';ctx.fillText('NO WAY THIS',132,1250)}
function wrap(ctx,text,x,maxW,y,lineH,maxLines){let words=text.includes(' ')?text.split(' '):[...text],lines=[],line='';for(let w of words){let t=line?(text.includes(' ')?line+' '+w:line+w):w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH))}
function drawAll(){drawCanvas('kr','kr');drawCanvas('jp','jp');let o=document.getElementById('orig'),x=getSel();if(o){o.width=1080;o.height=1350;let ctx=o.getContext('2d'),im=imgMap[x.id];ctx.fillStyle='#11161b';ctx.fillRect(0,0,1080,1350);if(im){cover(ctx,im,1080,1350);let ph=$('#origph');if(ph)ph.style.display='none'}}}
function downloadCard(lang){let c=document.getElementById(lang);if(!imgMap[getSel().id]){toast('먼저 실제 사진을 업로드하세요');return}let a=document.createElement('a');a.download=`noway_${getSel().id}_${lang}.png`;a.href=c.toDataURL('image/png');a.click()}
function copyText(lang){let v=lang==='kr'?getSel().captionKr:getSel().captionJp;navigator.clipboard.writeText(v);toast(lang.toUpperCase()+' 캡션 복사')}
function openModal(){$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
function addItem(){let title=$('#nTitle').value.trim();if(!title)return alert('제목을 입력하세요');let kr=$('#nHookKr').value.trim()||title,jp=$('#nHookJp').value.trim()||kr;let x={id:'n'+Date.now(),title,score:+$('#nScore').value||27,cat:$('#nCat').value,status:'HOLD',created:Date.now(),hooksKr:[kr,'',''],hooksJp:[jp,'',''],hookIdx:0,captionKr:$('#nCapKr').value,captionJp:$('#nCapJp').value,source:$('#nSource').value||'출처 입력 필요',fact:['원본 출처 확인','최근 24시간 여부 확인','핵심 사실 교차검증'],music:['음원 후보 입력 필요','original audio','트렌딩 음원 확인'],scores:[5,5,5,4,5,4]};data.unshift(x);selected=x.id;closeModal();save();toast('소재 추가 완료')}
function editLimit(){let v=prompt('14일 카운팅 목표/한도',limit);if(v&&+v>0){limit=+v;localStorage.setItem('nwf-limit',limit);renderCounter();renderAnalytics()}}
function showAnalytics(){$('#analytics').classList.toggle('on');$('#work').style.display=$('#analytics').classList.contains('on')?'none':'block'}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(a=>a.classList.remove('on'));t.classList.add('on');filter=t.dataset.filter;renderItems()});
render();
</script>
</body>
</html>
