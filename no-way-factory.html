function renderList(){let a=data.filter(x=>filter==='ALL'||x.status===filter);$('#list').innerHTML=a.map(x=>`<div class="item ${x.id===selected?'on':''}" onclick="selectItem('${x.id}')"><div class="itemLine"><div class="score">${x.score}</div><div><div class="itemTitle">${esc(x.title)}</div><div class="itemMeta"><span class="statusDot ${x.status}"></span>${x.status} · ${esc(x.cat)}</div></div></div></div>`).join('')}
function selectItem(id){selected=id;persist();render();autoSourceImage()}
function renderStudio(){let x=current();if(!x)return;let active=x.images.find(i=>i.id===x.activeImage);$('#imageState').textContent=active?'IMAGE READY':'FINDING IMAGE';$('#studio').innerHTML=`<div class="hero"><div><h2>${esc(x.title)}</h2><p>${esc(x.cat)} · viral score ${x.score}/30</p></div><select class="statusSelect" onchange="changeStatus(this.value)"><option ${x.status==='READY'?'selected':''}>READY</option><option ${x.status==='HOLD'?'selected':''}>HOLD</option><option ${x.status==='POSTED'?'selected':''}>POSTED</option></select></div><div class="sourceBox"><div class="sourceTop"><input id="sourceUrl" class="textInput" value="${esc(x.sourceUrl)}" placeholder="기사·원본 URL 또는 이미지 URL"><button class="primary" onclick="findSourceImage(true)">사진 찾기</button><button class="soft" onclick="pickFile()">업로드</button></div><div class="sourceHint">원문 대표사진을 자동으로 불러옵니다. 실제 사건 사진만 사용하고 최종 게시 전 사용권을 확인하세요.</div><div class="sourceHero"><div id="sourcePhoto" class="sourcePhoto"><div class="loadingPhoto">${active?'실제 사진 불러오는 중':'실제 사진 자동 탐색 중…'}</div></div><div class="sourceMeta"><b>${active?'실제 사진 연결됨':'사진을 찾고 있습니다'}</b><p>${active?'아래 카드에서 사진을 드래그해 위치를 조정하고 휠로 확대·축소할 수 있습니다.':'원문에서 대표 이미지를 찾지 못하면 직접 업로드하면 됩니다.'}</p></div></div><div id="candidates" class="candidates"></div></div><div class="previewGrid"><div class="previewCard"><span class="previewLabel">KR</span><span class="dragHint">drag · wheel</span><canvas id="kr"></canvas></div><div class="previewCard"><span class="previewLabel">JP</span><span class="dragHint">drag · wheel</span><canvas id="jp"></canvas></div></div><div class="headlineBox"><p class="eyebrow">HEADLINE</p><div class="hookPills">${x.hooksKr.map((h,i)=>`<button class="${i===x.hookIdx?'on':''}" onclick="setHook(${i})">${esc(h||('옵션 '+(i+1)))}</button>`).join('')}</div><div class="headlineRow"><input class="headline" value="${esc(x.hooksKr[x.hookIdx]||'')}" oninput="editHook('kr',this.value)"><input class="headline" value="${esc(x.hooksJp[x.hookIdx]||'')}" oninput="editHook('jp',this.value)"></div><div class="downloadRow"><button class="soft" onclick="downloadCard('kr')">KR 저장</button><button class="soft" onclick="downloadCard('jp')">JP 저장</button></div></div>`;renderCandidates();requestAnimationFrame(()=>{drawAll();bindCanvas('kr');bindCanvas('jp');renderSourcePhoto()})}
function renderCandidates(){let x=current(),el=$('#candidates');if(!el)return;el.innerHTML=x.images.map(im=>`<div class="candidate ${im.id===x.activeImage?'on':''}" onclick="chooseImage('${im.id}')"><img src="${displayUrl(im.url)}" onerror="this.style.opacity=.3"><span class="candidateBadge">${im.kind==='upload'?'FILE':'SOURCE'}</span></div>`).join('')}
async function renderSourcePhoto(){let x=current(),im=x.images.find(i=>i.id===x.activeImage),box=$('#sourcePhoto');if(!box)return;if(!im){box.innerHTML='<div class="loadingPhoto">실제 사진 자동 탐색 중…</div>';return}let src=await resolveUrl(im.url);box.innerHTML=`<img src="${esc(src)}" alt="실제 원본 사진" onerror="this.parentElement.innerHTML='<div class=&quot;loadingPhoto&quot;>사진 로드 실패 · 업로드를 사용하세요</div>'">`}
function displayUrl(u){if(!u)return'';if(u.startsWith('idb:'))return'';return proxy(u)}function proxy(u){if(!u||u.startsWith('data:')||u.startsWith('blob:'))return u;return 'https://images.weserv.nl/?url='+encodeURIComponent(u)+'&output=jpg&q=88'}
async function autoSourceImage(){let x=current();if(x.images.length||!x.sourceUrl)return;await findSourceImage(false)}
async function findSourceImage(showToast=true){let x=current(),inp=$('#sourceUrl'),url=(inp?.value||x.sourceUrl||'').trim();if(!url){if(showToast)toast('URL을 먼저 넣어주세요');return}x.sourceUrl=url;persist();try{let found=[];if(/\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(url))found=[url];else{let r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url));if(!r.ok)throw Error();let j=await r.json();if(j?.data?.image?.url)found.push(j.data.image.url)}if(!found.length)throw Error();for(let u of found)addCandidate(u,'auto',false);x.activeImage=x.images[x.images.length-1].id;x.frame={zoom:1,x:0,y:0};persist();render();await ensureActiveImage();drawAll();renderSourcePhoto();if(showToast)toast('실제 사진을 불러왔습니다')}catch(e){if(showToast)toast('자동 탐색 실패 · 직접 업로드해주세요');$('#imageState').textContent='UPLOAD IMAGE'}}
function addCandidate(url,kind='auto',rer=true){let x=current();if(x.images.some(i=>i.url===url))return;let im={id:'im'+Date.now()+Math.random().toString(16).slice(2),url,kind};x.images.push(im);x.activeImage=im.id;if(rer){persist();render()}}
function chooseImage(id){let x=current();x.activeImage=id;x.frame={zoom:1,x:0,y:0};persist();render();ensureActiveImage().then(drawAll)}function pickFile(){$('#fileInput').click()}
$('#fileInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let id='im'+Date.now(),d=await fileToData(f);await idbSet(id,d);let x=current();x.images.push({id,url:'idb:'+id,kind:'upload'});x.activeImage=id;x.frame={zoom:1,x:0,y:0};persist();render();toast('사진을 저장했습니다');e.target.value=''})
function fileToData(f){return new Promise(res=>{let r=new FileReader;r.onload=()=>res(r.result);r.readAsDataURL(f)})}async function resolveUrl(u){return u.startsWith('idb:')?await idbGet(u.slice(4)):proxy(u)}
async function ensureActiveImage(){let x=current(),im=x.images.find(i=>i.id===x.activeImage);if(!im)return null;if(liveImgs[im.id])return liveImgs[im.id];let src=await resolveUrl(im.url);return new Promise(res=>{let z=new Image;z.crossOrigin='anonymous';z.onload=()=>{liveImgs[im.id]=z;res(z)};z.onerror=()=>res(null);z.src=src})}
async function drawAll(){await drawCanvas('kr','kr');await drawCanvas('jp','jp')}async function drawCanvas(cid,lang){let c=document.getElementById(cid);if(!c)return;c.width=1080;c.height=1350;let ctx=c.getContext('2d'),x=current(),im=await ensureActiveImage();ctx.fillStyle='#121416';ctx.fillRect(0,0,1080,1350);if(im)drawCover(ctx,im,1080,1350,x.frame);else{let g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#24282d');g.addColorStop(1,'#0c0e10');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='rgba(255,255,255,.5)';ctx.textAlign='center';ctx.font='600 34px -apple-system,sans-serif';ctx.fillText(lang==='kr'?'실제 사진을 불러오는 중':'実際の写真を読み込み中',540,680)}let grad=ctx.createLinearGradient(0,650,0,1350);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(.48,'rgba(0,0,0,.48)');grad.addColorStop(1,'rgba(0,0,0,.94)');ctx.fillStyle=grad;ctx.fillRect(0,600,1080,750);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=14;ctx.font='800 80px -apple-system,BlinkMacSystemFont,sans-serif';wrap(ctx,lang==='kr'?x.hooksKr[x.hookIdx]:x.hooksJp[x.hookIdx],72,950,990,92,3);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.95)';ctx.font='700 26px -apple-system,sans-serif';ctx.fillText('NO WAY THIS',72,1265)}
function drawCover(ctx,im,w,h,f){let base=Math.max(w/im.width,h/im.height),s=base*(f.zoom||1),iw=im.width*s,ih=im.height*s,cx=(w-iw)/2+(f.x||0),cy=(h-ih)/2+(f.y||0);ctx.drawImage(im,cx,cy,iw,ih)}function wrap(ctx,text,x,maxW,y,lh,max){let chars=String(text||'').includes(' ')?String(text).split(' '):[...String(text||'')],lines=[],line='';for(let w of chars){let t=line?(String(text).includes(' ')?line+' '+w:line+w):w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);lines.slice(0,max).forEach((l,i)=>ctx.fillText(l,x,y+i*lh))}
function bindCanvas(id){let c=$('#'+id);if(!c)return;c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,fx:current().frame.x,fy:current().frame.y};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect(),x=current();x.frame.x=drag.fx+(e.clientX-drag.x)*(1080/r.width);x.frame.y=drag.fy+(e.clientY-drag.y)*(1350/r.height);persist();drawAll()};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();let x=current(),z=x.frame.zoom||1;z*=e.deltaY<0?1.06:.94;x.frame.zoom=Math.max(1,Math.min(3,z));persist();drawAll()}}
function setHook(i){current().hookIdx=i;save()}function editHook(l,v){let x=current();if(l==='kr')x.hooksKr[x.hookIdx]=v;else x.hooksJp[x.hookIdx]=v;persist();drawAll()}function editCaption(l,v){let x=current();if(l==='kr')x.captionKr=v;else x.captionJp=v;persist()}function changeStatus(v){let x=current();x.status=v;if(v==='POSTED'&&!x.postedAt)x.postedAt=Date.now();save()}
function renderSide(){let x=current();if(!x)return;$('#publishState').textContent=x.status;$('#sideBody').innerHTML=`<div class="section"><div class="sectionTop"><b>KR CAPTION</b><button class="copy" onclick="copyCap('kr')">복사</button></div><textarea class="captionArea" oninput="editCaption('kr',this.value)">${esc(x.captionKr)}</textarea></div><div class="section"><div class="sectionTop"><b>JP CAPTION</b><button class="copy" onclick="copyCap('jp')">コピー</button></div><textarea class="captionArea" oninput="editCaption('jp',this.value)">${esc(x.captionJp)}</textarea></div><div class="section"><div class="sectionTop"><b>INSTAGRAM MUSIC</b><span style="font-size:11px;color:var(--faint)">앱에서 선택</span></div>${x.music.map(m=>{let [a,b='']=m.split(' — ');return `<div class="music"><div>${esc(a)}<small>${esc(b)}</small></div><button class="copy" onclick="copyMusic('${esc(m).replace(/'/g,"\\'")}')">복사</button></div>`}).join('')}</div><div class="section"><div class="sectionTop"><b>FACT CHECK</b></div><div class="checks">${x.fact.map((f,i)=>`<label><input type="checkbox" ${x.factDone[i]?'checked':''} onchange="fact(${i},this.checked)">${esc(f)}</label>`).join('')}</div></div><div class="section"><div class="sectionTop"><b>SOURCE</b></div><div class="sourceText">${esc(x.sourceUrl||'출처 URL 없음')}</div></div><div class="section"><div class="publishNote">이미지 저장 → Instagram에서 사진 선택 → 음악 추가 → 추천 음원 검색 → 캡션 붙여넣기 → 게시</div><button class="postedBtn" onclick="markPosted()">게시 완료</button></div>`}
function copyCap(l){navigator.clipboard.writeText(l==='kr'?current().captionKr:current().captionJp);toast('캡션 복사 완료')}function copyMusic(v){navigator.clipboard.writeText(v);toast('음원명 복사 완료')}function fact(i,v){current().factDone[i]=v;persist()}function markPosted(){let x=current();x.status='POSTED';x.postedAt=Date.now();save();toast('POSTED로 기록했습니다')}
async function downloadCard(l){let c=$('#'+l);if(!current().activeImage)return toast('먼저 실제 사진을 연결해주세요');try{let a=document.createElement('a');a.download=`noway_${current().id}_${l}.png`;a.href=c.toDataURL('image/png');a.click()}catch(e){toast('이미지 저장 실패 · 직접 업로드 사진을 사용해보세요')}}
function openModal(){$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}function addItem(){let t=$('#nTitle').value.trim();if(!t)return toast('제목을 입력해주세요');let x={id:'n'+Date.now(),title:t,score:+$('#nScore').value||28,cat:$('#nCat').value,status:'READY',created:Date.now(),sourceUrl:$('#nSource').value.trim(),hooksKr:[$('#nKr').value.trim()||t,'',''],hooksJp:[$('#nJp').value.trim()||t,'',''],hookIdx:0,captionKr:$('#nCapKr').value,captionJp:$('#nCapJp').value,music:['추천 음원 입력 필요 — Instagram','original audio — Instagram','트렌딩 음원 확인 — Instagram'],fact:['원본 사진 출처 확인','사건 날짜 확인','핵심 사실 교차검증'],factDone:[],images:[],activeImage:null,frame:{zoom:1,x:0,y:0}};data.unshift(x);selected=x.id;closeModal();save();autoSourceImage()}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;renderList()})
function idb(){return new Promise((res,rej)=>{let q=indexedDB.open('nwf-images',1);q.onupgradeneeded=()=>q.result.createObjectStore('imgs');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function idbSet(k,v){let d=await idb();return new Promise((res,rej)=>{let t=d.transaction('imgs','readwrite');t.objectStore('imgs').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function idbGet(k){try{let d=await idb();return await new Promise((res,rej)=>{let t=d.transaction('imgs','readonly'),q=t.objectStore('imgs').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
render();setTimeout(autoSourceImage,250);
</script>
</body>
