gba(255,255,255,.055);border-radius:999px;padding:3px;gap:2px}.seg button{border:0;background:transparent;color:var(--muted);font-size:9px;padding:6px 9px;border-radius:999px;cursor:pointer}.seg button.on{background:rgba(255,255,255,.13);color:#fff}.list{padding:8px;max-height:calc(100vh - 126px);overflow:auto}.item{padding:13px 12px;border-radius:18px;cursor:pointer;border:1px solid transparent;transition:.16s;margin-bottom:3px}.item:hover{background:rgba(255,255,255,.04)}.item.on{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.09)}.itemLine{display:flex;gap:10px;align-items:center}.score{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;font-weight:730;flex:none}.item.on .score{background:rgba(255,255,255,.92);color:#090a0c}.itemTitle{font-size:11px;font-weight:650;line-height:1.42}.itemMeta{margin-top:4px;color:var(--faint);font-size:9px}.statusDot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px;background:#8c939b}.statusDot.READY{background:var(--ok)}.statusDot.POSTED{background:var(--blue)}.statusDot.HOLD{background:var(--warn)}.studio{padding:19px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:17px}.hero h2{font-size:19px;line-height:1.25;margin:0 0 6px;letter-spacing:-.035em;font-weight:700}.hero p{margin:0;color:var(--muted);font-size:10px}.statusSelect{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;border-radius:999px;padding:8px 28px 8px 11px;font-size:9px;outline:0;background-image:linear-gradient(45deg,transparent 50%,#899099 50%),linear-gradient(135deg,#899099 50%,transparent 50%);background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}.sourceBox{border:1px solid rgba(255,255,255,.085);background:rgba(255,255,255,.035);border-radius: ransform:uppercase;margin:0 0 8px}.hookPills{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.hookPills button{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.045);color:var(--muted);border-radius:999px;padding:8px 10px;font-size:9px;cursor:pointer;white-space:nowrap}.hookPills button.on{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.12)}.headlineRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.headline{width:100%;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.16);color:#fff;border-radius:14px;padding:10px 12px;outline:0;font-size:10px}.downloadRow{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}.sideBody{padding:13px;max-height:calc(100vh - 126px);overflow:auto}.section{border-bottom:1px solid rgba(255,255,255,.07);padding:2px 1px 14px;margin-bottom:14px}.section:last-child{border:0;margin:0}.sectionTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sectionTop b{font-size:10px;font-weight:650}.copy{border:0;background:none;color:var(--blue);font-size:9px;cursor:pointer;padding:5px}.captionArea{width:100%;min-height:145px;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.15);border-radius:16px;color:rgba(255,255,255,.86);padding:12px;outline:0;resize:vertical;font-size:10px;line-height:1.65}.music{padding:9px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.055);font-size:10px}.music:last-child{border:0}.music small{display:block;color:var(--faint);font-size:8px;margin-top:2px}.sourceText{font-size:9px;color:var(--muted);line-height:1.6;word-break:break-all}.checks label{display:flex;align-items:center;gap:8px;font-size:9px;color:var(--muted);padding:5px 0;cursor:pointer}.checks input{accent-color:#fff}.publishNote{font-size:9px;color:var(--faint);line-height:1.65}.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(15px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modalCard{width:min(560px,100%);border-radius:30px;padding:20px}.modalTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modalTop h3{margin:0;font-size:16px}.form{display:grid;gap:9px}.form label{font-size:9px;color:var(--muted);margin:0 3px 4px;display:block}.form input,.form textarea,.form select{width:100%;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.18);color:#fff;border-radius:15px;padding:11px 12px;outline:0;font-size:10px}.form textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formAction{display:flex;justify-content:flex-end;margin-top:6px}.toast{position:fixed;z-index:150;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(245,247,250,.94);color:#0a0b0c;border-radius:999px;padding:10px 15px;font-size:10px;font-weight:700;transition:.2s;box-shadow:0 18px 50px rgba(0,0,0,.28)}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{opacity:.5;pointer-events:none}.miniLink{font-size:8px;color:var(--blue);text-decoration:none}.hidden{display:none!important}

<body>
<div class="shell">
  <header class="top glass">
    <div class="topin">
      <div class="brand"><div class="mark">NW</div><div><h1>NO WAY FACTORY</h1><p>one source · two markets · ready to post</p></div></div>
      <div class="quota"><div class="quotaLine"><span>14 DAYS</span><span><b id="count14">0</b> / <span id="limitText">150</span></span></div><div class="track"><i id="quotaBar"></i></div></div>
      <button class="iconBtn" aria-label="새 소재" title="새 소재" onclick="openModal()">+</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel glass">
      <div class="head"><span>RADAR</span><div class="seg"><button class="on" data-filter="ALL">All</button><button data-filter="READY">Ready</button><button data-filter="POSTED">Posted</button></div></div>
      <div id="list" class="list"></div>
    </aside>

    <main class="panel glass">
      <div id="studio" class="studio"></div>
    </main>

    <aside class="panel glass side">
      <div class="head"><span>PUBLISH</span><span id="sideState" style="font-size:9px;color:var(--faint)"></span></div>
      <div id="sideBody" class="sideBody"></div>
    </aside>
  </div>
</div>

<div id="modal" class="modal"><div class="modalCard glass"><div class="modalTop"><h3>새 소재</h3><button class="iconBtn" onclick="closeModal()">×</button></div><div class="form">
  <div><label>제목</label><input id="nTitle" placeholder="무슨 일이 벌어졌는지 한 문장으로"></div>
  <div class="two"><div><label>점수</label><input id="nScore" type="number" min="0" max="30" value="28"></div><div><label>카테고리</label><select id="nCat"><option>해외토픽</option><option>해외연예</option><option>국내연예</option><option>동물</option><option>생존/구조</option></select></div></div>
  <div><label>기사 · 원본 URL</label><input id="nSource" placeholder="https://..."></div>
  <div class="two"><div><label>KR 훅</label><input id="nKr" placeholder="짧고 강하게"></div><div><label>JP 훅</label><input id="nJp" placeholder="日本語フック"></div></div>
  <div><label>KR 캡션</label><textarea id="nCapKr"></textarea></div><div><label>JP 캡션</label><textarea id="nCapJp"></textarea></div>
  <div class="formAction"><button class="primary" onclick="addItem()">추가</button></div>
</div></div></div>
<input id="fileInput" class="hidden" type="file" accept="image/*">
<div id="toast" class="toast"></div>
<script>
const seed=[
{id:'s1',title:'23살 조종사가 비행기를 바다에 내린 순간',score:29,cat:'생존/구조',status:'READY',created:Date.now()-3600000,sourceUrl:'',hooksKr:['바다에 내렸다','23살 조종사의 선택','엔진이 멈췄다'],hooksJp:['海に着陸した','23歳の決断','エンジンが止まった'],hookIdx:0,captionKr:'23살 조종사가 비행 도중 엔진과 랜딩기어 고장을 동시에 맞았습니다.\n\n결국 그녀가 선택한 활주로는 바다였습니다.\n\n사람이 붐비는 해변을 피해 바다에 비상착수했고, 큰 부상 없이 구조됐습니다.\n\n여러분이라면 저 순간 같은 결정을 할 수 있었을까요?\n\n#NOWAYTHIS #해외토픽 #생존실화',captionJp:'23歳のパイロットが飛行中、エンジンと着陸装置のトラブルに直面しました。\n\n彼女が選んだ滑走路は海でした。\n\n#海外ニュース #実話 #NOWAYTHIS',music:['Experience — Ludovico Einaudi','Runaway — AURORA','The Nights — Avicii'],fact:['원본 사진 출처 확인','사건 날짜 확인','핵심 수치 교차검증'],factDone:[],images:[],activeImage:null,frame:{zoom:1,x:0,y:0}},
{id:'s2',title:'지드래곤이 카메라 감독 뒤를 막아선 장면',score:29,cat:'국내연예',status:'HOLD',created:Date.now()-7200000,sourceUrl:'',hooksKr:['뒤를 먼저 봤다','지드래곤이 막아섰다','한 걸음 전이었다'],hooksJp:['先に後ろを見た','G-DRAGONが止めた','あと一歩だった'],hookIdx:0,captionKr:'공연 도중 카메라 감독이 무대 끝으로 뒷걸음질했습니다.\n\n지드래곤은 이를 먼저 발견하고 감독 뒤로 이동해 안전을 확인했습니다.\n\n#NOWAYTHIS #지드래곤',captionJp:'公演中、カメラマンがステージの端へ後ずさり。\nG-DRAGONはそれに気づき、安全を確認しました。\n\n#GDRAGON #NOWAYTHIS',music:['HOME SWEET HOME — G-DRAGON','Untitled, 2014 — G-DRAGON','original audio'],fact:['실제 영상 확인','추락·부상 과장 금지','원게시자 확인'],factDone:[],images:[],activeImage:null,frame:{zoom:1,x:0,y:0}},
{id:'s3',title:'텍사스 쇼핑센터에서 발견된 정체불명 동물',score:28,cat:'동물',status:'READY',created:Date.now()-10800000,sourceUrl:'',hooksKr:['경찰도 몰랐다','이 동물의 정체는?','캥거루? 원숭이?'],hooksJp:['警察も分からなかった','この動物の正体は？','カンガルー？サル？'],hookIdx:1,captionKr:'미국 텍사스 쇼핑센터에서 정체불명의 동물이 발견됐습니다.\n\n정체는 중남미 열대우림에 사는 킨카주였습니다.\n\n#NOWAYTHIS #해외토픽 #희귀동물',captionJp:'アメリカ・テキサスのショッピングセンターで謎の動物が発見されました。\n\n正体はキンカジューでした。\n\n#海外ニュース #NOWAYTHIS',music:['Mystery of Love — Sufjan Stevens','Curious — Franz Ferdinand','original audio'],fact:['공식 발표 확인','동물 종 확인','소유 관계 단정 금지'],factDone:[],images:[],activeImage:null,frame:{zoom:1,x:0,y:0}}
];
let data=normalize(JSON.parse(localStorage.getItem('nwf-v2-data')||'null')||seed);let selected=localStorage.getItem('nwf-v2-selected')||data[0]?.id;let filter='ALL';let limit=+(localStorage.getItem('nwf-v2-limit')||150);const liveImgs={};let drag=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function normalize(a){return a.map(x=>({...x,sourceUrl:x.sourceUrl||x.source||'',images:x.images||[],activeImage:x.activeImage||null,frame:x.frame||{zoom:1,x:0,y:0},factDone:x.factDone||[],hooksKr:(x.hooksKr||['','','']).concat(['','','']).slice(0,3),hooksJp:(x.hooksJp||['','','']).concat(['','','']).slice(0,3)}))}
function save(){localStorage.setItem('nwf-v2-data',JSON.stringify(data));localStorage.setItem('nwf-v2-selected',selected);render()}
function current(){return data.find(x=>x.id===selected)||data[0]}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){renderQuota();renderList();renderStudio();renderSide()}
function renderQuota(){let cutoff=Date.now()-14*864e5,c=data.filter(x=>x.status==='POSTED'&&x.postedAt>=cutoff).length;$('#count14').textContent=c;$('#limitText').textContent=limit;$('#quotaBar').style.width=Math.min(100,c/limit*100)+'%'}
function renderList(){let a=data.filter(x=>filter==='ALL'||x.status===filter);$('#list').innerHTML=a.length?a.map(x=>`<div class="item ${x.id===selected?'on':''}" onclick="selectItem('${x.id}')"><div class="itemLine"><div class="score">${x.score}</div><div><div class="itemTitle">${esc(x.title)}</div><div class="itemMeta"><span class="statusDot ${x.status}"></span>${x.status} · ${esc(x.cat)}</div></div></div></div>`).join(''):'<div style="padding:30px;color:var(--faint);font-size:10px;text-align:center">비어 있습니다</div>'}
function selectItem(id){selected=id;save()}
function renderStudio(){let x=current();if(!x){$('#studio').innerHTML='';return}$('#studio').innerHTML=`<div class="hero"><div><h2>${esc(x.title)}</h2><p>${esc(x.cat)} · viral score ${x.score}/30</p></div><select class="statusSelect" onchange="changeStatus(this.value)"><option ${x.status==='READY'?'selected':''}>READY</option><option ${x.status==='HOLD'?'selected':''}>HOLD</option><option ${x.status==='POSTED'?'selected':''}>POSTED</option><option ${x.status==='REJECT'?'selected':''}>REJECT</option></select></div>
<div class="sourceBox"><div class="sourceTop"><input id="sourceUrl" class="textInput" value="${esc(x.sourceUrl)}" placeholder="기사·원본 URL을 붙여넣으면 대표 이미지를 찾습니다"><button id="findBtn" class="primary" onclick="findSourceImage()">이미지 찾기</button><button class="soft" onclick="pickFile()">파일</button></div><div class="sourceHint">실제 사건 사진만 사용합니다. 자동 탐색 결과는 출처·사용권을 반드시 확인하세요.</div><div id="candidates" class="candidates"></div></div>
<div class="previewGrid"><div class="previewCard"><span class="previewLabel">KR</span><span class="dragHint">drag · wheel</span><canvas id="kr"></canvas></div><div class="previewCard"><span class="previewLabel">JP</span><span class="dragHint">drag · wheel</span><canvas id="jp"></canvas></div></div>
<div class="headlineBox"><p class="eyebrow">Headline</p><div class="hookPills">${x.hooksKr.map((h,i)=>`<button class="${i===x.hookIdx?'on':''}" onclick="setHook(${i})">${esc(h||('옵션 '+(i+1)))}</button>`).join('')}</div><div class="headlineRow"><input class="headline" value="${esc(x.hooksKr[x.hookIdx]||'')}" oninput="editHook('kr',this.value)" placeholder="한국어 헤드라인"><input class="headline" value="${esc(x.hooksJp[x.hookIdx]||'')}" oninput="editHook('jp',this.value)" placeholder="日本語ヘッドライン"></div><div class="downloadRow"><button class="soft" onclick="downloadCard('kr')">KR 저장</button><button class="soft" onclick="downloadCard('jp')">JP 저장</button></div></div>`;renderCandidates();requestAnimationFrame(()=>{drawAll();bindCanvas('kr');bindCanvas('jp')})}
function renderCandidates(){let x=current(),el=$('#candidates');if(!el)return;let cards=x.images.map(im=>`<div class="candidate ${im.id===x.activeImage?'on':''}" onclick="chooseImage('${im.id}')"><img src="${esc(im.url)}" onerror="this.parentElement.style.opacity=.3"><span class="candidateBadge">${im.kind==='auto'?'AUTO':im.kind==='upload'?'FILE':'URL'}</span></div>`).join('');el.innerHTML=cards+`<div class="candidate" onclick="addImageUrl()"><div class="candidateEmpty">+ 이미지 URL</div></div>`}
async function findSourceImage(){let x=current(),url=$('#sourceUrl').value.trim();if(!url)return toast('URL을 먼저 넣어주세요');x.sourceUrl=url;persist();let b=$('#findBtn');b.textContent='찾는 중';b.disabled=true;try{let direct=/\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(url);let found=[];if(direct)found=[url];else{let api='https://api.microlink.io/?url='+encodeURIComponent(url);let r=await fetch(api);if(!r.ok)throw Error('metadata');let j=await r.json();let u=j?.data?.image?.url;if(u)found.push(u)}if(!found.length)throw Error('none');found.forEach(u=>addCandidate(u,'auto',false));x.activeImage=x.images[x.images.length-1].id;persist();await ensureActiveImage();renderStudio();toast('대표 이미지를 찾았습니다')}catch(e){toast('자동 탐색 실패 · 이미지 URL이나 파일을 사용하세요')}finally{let nb=$('#findBtn');if(nb){nb.textContent='이미지 찾기';nb.disabled=false}}}
function addImageUrl(){let u=prompt('실제 사진 URL을 입력하세요');if(!u)return;addCandidate(u.trim(),'url',true)}
function addCandidate(url,kind='url',rer=true){let x=current();if(x.images.some(i=>i.url===url)){if(rer)toast('이미 추가된 이미지입니다');return}let im={id:'im'+Date.now()+Math.random().toString(16).slice(2),url,kind,rights:'check'};x.images.push(im);x.activeImage=im.id;persist();if(rer){renderStudio();toast('이미지 후보 추가')}}
function chooseImage(id){let x=current();x.activeImage=id;x.frame={zoom:1,x:0,y:0};persist();ensureActiveImage().then(()=>{renderCandidates();drawAll()})}
function pickFile(){$('#fileInput').click()}
$('#fileInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let id='im'+Date.now();let dataUrl=await fileToData(f);await idbSet(id,dataUrl);let x=current();x.images.push({id,url:'idb:'+id,kind:'upload',rights:'check'});x.activeImage=id;x.frame={zoom:1,x:0,y:0};persist();renderStudio();toast('파일을 저장했습니다');e.target.value=''})
function fileToData(f){return new Promise(res=>{let r=new FileReader;r.onload=()=>res(r.result);r.readAsDataURL(f)})}
function persist(){localStorage.setItem('nwf-v2-data',JSON.stringify(data));localStorage.setItem('nwf-v2-selected',selected)}
async function ensureActiveImage(){let x=current(),im=x.images.find(i=>i.id===x.activeImage);if(!im)return null;if(liveImgs[im.id])return liveImgs[im.id];let src=im.url.startsWith('idb:')?await idbGet(im.url.slice(4)):im.url;return await new Promise(res=>{let z=new Image;z.crossOrigin='anonymous';z.onload=()=>{liveImgs[im.id]=z;res(z)};z.onerror=()=>res(null);z.src=src})}
async function drawAll(){await drawCanvas('kr','kr');await drawCanvas('jp','jp')}
async function drawCanvas(cid,lang){let c=document.getElementById(cid);if(!c)return;c.width=1080;c.height=1350;let ctx=c.getContext('2d'),x=current(),im=await ensureActiveImage();ctx.fillStyle='#111315';ctx.fillRect(0,0,1080,1350);if(im)drawCover(ctx,im,1080,1350,x.frame);else{let g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#25292e');g.addColorStop(1,'#0d0f11');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='rgba(255,255,255,.28)';ctx.textAlign='center';ctx.font='600 28px -apple-system,sans-serif';ctx.fillText(lang==='kr'?'실제 사진을 선택하세요':'実際の写真を選択',540,680)}let gr=ctx.createLinearGradient(0,650,0,1350);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.45,'rgba(0,0,0,.34)');gr.addColorStop(1,'rgba(0,0,0,.86)');ctx.fillStyle=gr;ctx.fillRect(0,600,1080,750);let text=lang==='kr'?x.hooksKr[x.hookIdx]:x.hooksJp[x.hookIdx];ctx.textAlign='left';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.font='800 72px -apple-system,BlinkMacSystemFont,sans-serif';wrapText(ctx,text,70,975,958,82,3);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.94)';ctx.font='700 22px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('NO WAY THIS',70,1252)}
function drawCover(ctx,im,w,h,f){let base=Math.max(w/im.width,h/im.height),s=base*(f.zoom||1),dw=im.width*s,dh=im.height*s;let maxX=Math.max(0,(dw-w)/2),maxY=Math.max(0,(dh-h)/2),ox=Math.max(-maxX,Math.min(maxX,f.x||0)),oy=Math.max(-maxY,Math.min(maxY,f.y||0));ctx.drawImage(im,(w-dw)/2+ox,(h-dh)/2+oy,dw,dh)}
function wrapText(ctx,text,x,maxW,y,lh,max){let chars=text.includes(' ')?text.split(' '):[...text],lines=[],line='';for(let ch of chars){let t=line?(text.includes(' ')?line+' '+ch:line+ch):ch;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=ch}else line=t}if(line)lines.push(line);lines.slice(0,max).forEach((l,i)=>ctx.fillText(l,x,y+i*lh))}
function bindCanvas(id){let c=document.getElementById(id);if(!c)return;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,fx:current().frame.x||0,fy:current().frame.y||0}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect();current().frame.x=drag.fx+(e.clientX-drag.x)/r.width*1080;current().frame.y=drag.fy+(e.clientY-drag.y)/r.height*1350;persist();drawAll()};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();let x=current();x.frame.zoom=Math.max(1,Math.min(2.4,(x.frame.zoom||1)+(e.deltaY<0?.06:-.06)));persist();drawAll()}}
function setHook(i){current().hookIdx=i;persist();renderStudio()}
function editHook(lang,v){let x=current();if(lang==='kr')x.hooksKr[x.hookIdx]=v;else x.hooksJp[x.hookIdx]=v;persist();drawAll()}
function changeStatus(v){let x=current();x.status=v;if(v==='POSTED'&&!x.postedAt)x.postedAt=Date.now();if(v!=='POSTED')x.postedAt=null;save();toast(v+' 저장')}
function downloadCard(lang){let x=current();if(!x.activeImage)return toast('먼저 실제 이미지를 선택하세요');let c=document.getElementById(lang),a=document.createElement('a');a.download=`noway_${x.id}_${lang}.png`;a.href=c.toDataURL('image/png');a.click()}
function renderSide(){let x=current();if(!x){$('#sideBody').innerHTML='';return}$('#sideState').textContent=x.status;$('#sideBody').innerHTML=`<div class="section"><div class="sectionTop"><b>KR CAPTION</b><button class="copy" onclick="copyCaption('kr')">복사</button></div><textarea id="capKr" class="captionArea" oninput="editCaption('kr',this.value)">${esc(x.captionKr||'')}</textarea></div><div class="section"><div class="sectionTop"><b>JP CAPTION</b><button class="copy" onclick="copyCaption('jp')">コピー</button></div><textarea id="capJp" class="captionArea" oninput="editCaption('jp',this.value)">${esc(x.captionJp||'')}</textarea></div><div class="section"><div class="sectionTop"><b>INSTAGRAM MUSIC</b><span style="font-size:8px;color:var(--faint)">앱에서 선택</span></div>${(x.music||[]).slice(0,3).map((m,i)=>`<div class="music"><div><b style="font-size:9px">${esc(m.split(' — ')[0])}</b><small>${esc(m.split(' — ')[1]||'')}</small></div><button class="copy" onclick="copyMusic(${i})">복사</button></div>`).join('')}</div><div class="section"><div class="sectionTop"><b>FACT CHECK</b></div><div class="checks">${(x.fact||[]).map((f,i)=>`<label><input type="checkbox" ${x.factDone[i]?'checked':''} onchange="factDone(${i},this.checked)">${esc(f)}</label>`).join('')}</div></div><div class="section"><div class="sectionTop"><b>SOURCE</b></div><div class="sourceText">${x.sourceUrl?`<a class="miniLink" href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">원문 열기 ↗</a><br>${esc(x.sourceUrl)}`:'아직 출처 URL이 없습니다.'}</div></div><div class="publishNote">이미지와 캡션이 준비되면 Instagram 앱에서 사진을 선택하고 추천 음원을 붙인 뒤 게시하세요. 게시 직후 상단 상태를 POSTED로 바꾸면 14일 카운터에 반영됩니다.</div>`}
function editCaption(lang,v){let x=current();if(lang==='kr')x.captionKr=v;else x.captionJp=v;persist()}
function copyCaption(lang){let x=current(),t=lang==='kr'?x.captionKr:x.captionJp;navigator.clipboard.writeText(t||'');toast('캡션 복사')}
function copyMusic(i){let m=current().music[i]||'';navigator.clipboard.writeText(m);toast('음원명 복사')}
function factDone(i,v){current().factDone[i]=v;persist()}
function openModal(){$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
function addItem(){let title=$('#nTitle').value.trim();if(!title)return toast('제목을 입력하세요');let kr=$('#nKr').value.trim()||title,jp=$('#nJp').value.trim()||kr;let x={id:'n'+Date.now(),title,score:+$('#nScore').value||27,cat:$('#nCat').value,status:'HOLD',created:Date.now(),sourceUrl:$('#nSource').value.trim(),hooksKr:[kr,'',''],hooksJp:[jp,'',''],hookIdx:0,captionKr:$('#nCapKr').value,captionJp:$('#nCapJp').value,music:['추천 음원 입력 필요','original audio','트렌딩 음원 확인'],fact:['원본 사진 출처 확인','24시간 이내 이슈인지 확인','핵심 사실 교차검증'],factDone:[],images:[],activeImage:null,frame:{zoom:1,x:0,y:0}};data.unshift(x);selected=x.id;closeModal();save();toast('소재 추가');setTimeout(()=>{if(x.sourceUrl)findSourceImage()},120)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),1700)}
$$('.seg button').forEach(b=>b.onclick=()=>{$$('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;renderList()});
function idbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open('nwf-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){let db=await idbOpen();return new Promise((res,rej)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){let db=await idbOpen();return new Promise((res,rej)=>{let r=db.transaction('files').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
render();
</script>
</body>
</html>
