<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>NO WAY FACTORY</title>
<link rel="stylesheet" href="factory-v2.css?v=20260825-2140">
<link rel="stylesheet" href="factory-caption.css?v=20260825-2207">
<link rel="stylesheet" href="factory-posted.css?v=20260825-2217">
<link rel="stylesheet" href="factory-trash.css?v=20260825-2255">
<link rel="stylesheet" href="factory-lang3.css?v=20260825-2317">
<link rel="stylesheet" href="factory-discovery.css?v=20260825-2345">
<link rel="stylesheet" href="factory-format.css?v=20260825-2359">
<link rel="stylesheet" href="factory-video.css?v=20260826-0024">
</head>
<body>
<div class="shell">
  <header class="top glass">
    <div class="brand"><div class="mark">NW</div><div><h1>NO WAY FACTORY</h1><p>one source · reels first · carousel next</p></div></div>
    <div class="quota"><div class="quota-line"><span>14 DAYS</span><span><b id="count14">0</b> / 150</span></div><div class="track"><i id="quotaBar"></i></div></div>
    <button class="circle" id="addBtn" aria-label="새 소재">+</button>
  </header>
  <div class="layout">
    <aside class="panel glass radar">
      <div class="panel-head">
        <span>RADAR</span>
        <div class="radar-head-actions">
          <button class="discover-btn" id="discoverBtn" onclick="discoverReadyTen()">발굴 +10</button>
          <div class="segments"><button data-filter="ALL">ALL</button><button class="active" data-filter="READY">READY</button><button data-filter="POSTED">POSTED</button></div>
        </div>
      </div>
      <div class="radar-list" id="radarList"></div>
    </aside>
    <main class="panel glass studio-panel">
      <div class="panel-head"><span>STUDIO</span><span id="imageCount">AUTO · MEDIA</span></div>
      <div id="studio" class="studio"></div>
    </main>
    <aside class="panel glass publish-panel">
      <div class="panel-head"><span>PUBLISH</span><span id="publishState">READY</span></div>
      <div id="publish" class="publish"></div>
    </aside>
  </div>
</div>
<div id="modal" class="modal">
  <div class="modal-card glass">
    <div class="modal-head"><h2>새 소재</h2><button class="circle" id="closeModal">×</button></div>
    <div class="form">
      <label>제목<input id="newTitle" placeholder="무슨 일이 벌어졌는지 한 문장으로"></label>
      <label>기사·원본 URL<input id="newSource" placeholder="https://..."></label>
      <label>KR 헤드라인<textarea id="newKr" placeholder="한국어 · Enter로 줄바꿈"></textarea></label>
      <label>JP 헤드라인<textarea id="newJp" placeholder="日本語 · Enterで改行"></textarea></label>
      <label>EN 헤드라인<textarea id="newEn" placeholder="English · Enter for line breaks"></textarea></label>
      <label>KR 캡션<textarea id="newCapKr" placeholder="권장 350~650자 · 첫줄 훅 → 사건 개요 → 디테일 → 팩트 → CTA"></textarea></label>
      <label>JP 캡션<textarea id="newCapJp" placeholder="推奨 220〜500文字 · hook → context → detail → fact → CTA"></textarea></label>
      <label>EN 캡션<textarea id="newCapEn" placeholder="Recommended 300–700 characters · hook → context → detail → fact → CTA"></textarea></label>
      <div class="form-actions"><button class="primary" id="saveNew">추가하고 미디어 찾기</button></div>
    </div>
  </div>
</div>
<input id="fileInput" type="file" accept="image/*,video/*" hidden>
<div id="toast" class="toast"></div>
<script src="factory-v2.js?v=20260825-2140"></script>
<script src="factory-caption.js?v=20260825-2207"></script>
<script src="factory-posted.js?v=20260825-2255"></script>
<script src="factory-radar-20260825.js?v=20260825-2228"></script>
<script src="factory-auto.js?v=20260826-0012"></script>
<script src="factory-trash.js?v=20260825-2255"></script>
<script src="factory-lang3.js?v=20260825-2317"></script>
<script src="factory-discovery.js?v=20260826-0012"></script>
<script src="factory-workflow.js?v=20260825-2359"></script>
<script src="factory-video.js?v=20260826-0024"></script>
</body>
</html>
